name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "${{ inputs.version }}" in
              ''|*[!0-9A-Za-z._-]*) echo "invalid release version" >&2; exit 1 ;;
            esac
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            case "$GITHUB_REF_NAME" in
              v*) echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV" ;;
              *) echo "invalid tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cpio             dosfstools             expect             file             gzip             grub-common             grub-efi-amd64-bin             grub-pc-bin             grub2-common             mtools             ovmf             qemu-system-x86             xorriso             python3

      - name: Build yspm
        env:
          YSPM_OUTPUT: /tmp/yspm
          YSPM_REF: 824b39de2758f5434889b7814888cad2f6a4f16a
        run: sh tools/build-yspm

      - name: Build and verify kernel
        run: |
          sudo sh tools/build-kernel /tmp/vmlinuz /tmp/kernel-modules
          file -b /tmp/vmlinuz | grep -Eqi 'Linux kernel'
          test -s /tmp/vmlinuz
          test -d /tmp/kernel-modules/lib/modules

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          KERNEL_MODULES_DIR: /tmp/kernel-modules
        run: |
          DISTRO_VERSION="${RELEASE_TAG#v}" sudo -E sh build/rootfs.build

      - name: Build live ISO
        run: |
          ISO="ObsidianCoreLinux-${RELEASE_TAG}.iso"
          sudo sh tools/build-iso /tmp/rootfs.tar /tmp/vmlinuz "$PWD/$ISO"
          test -s "$ISO"

      - name: Verify ISO and initramfs
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${RELEASE_TAG}.iso"
          rm -rf iso-root efi-check
          mkdir -p iso-root efi-check

          xorriso -osirrox on -indev "$ISO" -extract /boot iso-root/boot
          test -s iso-root/boot/vmlinuz
          test -s iso-root/boot/initramfs.img
          test -s iso-root/boot/grub/grub.cfg
          test -s iso-root/boot/BOOTX64.EFI
          test -s iso-root/boot/efi.img

          mcopy -i iso-root/boot/efi.img ::/EFI/BOOT/BOOTX64.EFI efi-check/BOOTX64.EFI
          test -s efi-check/BOOTX64.EFI

          file -b iso-root/boot/vmlinuz | grep -Eqi 'Linux kernel'
          cpio -it < iso-root/boot/initramfs.img > initramfs.list 2>/dev/null
          for member in init bin/sh etc/init etc/hc-live usr/sbin/hc-installer boot/BOOTX64.EFI boot/efi.img; do
            grep -Eq "(^|/)${member}$" initramfs.list || {
              echo "missing initramfs member: ${member}"
              exit 1
            }
          done

          xorriso -indev "$ISO" -report_el_torito plain
          sha256sum "$ISO" > "$ISO.sha256"

      - name: Boot live ISO in UEFI QEMU
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${RELEASE_TAG}.iso"
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit)"
          test -n "$OVMF_CODE"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -cdrom "$ISO" \
            -boot d \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-live-uefi.log 2>&1
          rc=$?
          set -e

          cat qemu-live-uefi.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-live-uefi.log
          grep -q 'Obsidian Core Linux installer' qemu-live-uefi.log

      - name: Boot live ISO in BIOS QEMU
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${RELEASE_TAG}.iso"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cdrom "$ISO" \
            -boot d \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-live-bios.log 2>&1
          rc=$?
          set -e

          cat qemu-live-bios.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-live-bios.log
          grep -q 'Obsidian Core Linux installer' qemu-live-bios.log

      - name: Install ISO to virtual disk
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${RELEASE_TAG}.iso"
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit)"
          test -n "$OVMF_CODE"

          truncate -s 2G test-disk.img
          timeout --kill-after=10s 180s expect tools/ci-installer.expect \
            "$ISO" "$OVMF_CODE" test-disk.img \
            > qemu-install.log 2>&1

      - name: Verify installed disk
        run: |
          set -eu
          sudo losetup --find --show --partscan test-disk.img > loopdev
          LOOP="$(cat loopdev)"

          cleanup() {
            sudo umount /mnt/obsidian-test/boot/efi 2>/dev/null || true
            sudo umount /mnt/obsidian-test 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
            sudo rm -rf /mnt/obsidian-test
          }
          trap cleanup EXIT

          sudo mkdir -p /mnt/obsidian-test
          sudo mount "${LOOP}p2" /mnt/obsidian-test
          sudo test -s /mnt/obsidian-test/boot/vmlinuz
          sudo test -s /mnt/obsidian-test/boot/grub/grub.cfg
          sudo test -s /mnt/obsidian-test/etc/fstab

          sudo mount "${LOOP}p1" /mnt/obsidian-test/boot/efi
          sudo test -s /mnt/obsidian-test/boot/efi/EFI/BOOT/BOOTX64.EFI

      - name: Boot installed system in UEFI QEMU
        run: |
          set -eu
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit)"
          test -n "$OVMF_CODE"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive file=test-disk.img,format=raw,if=ide \
            -boot order=c \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-installed.log 2>&1
          rc=$?
          set -e

          cat qemu-installed.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-installed.log

      - name: Build native package repository
        run: |
          rm -rf repo-yspm
          python3 tools/migrate-legacy-repo.py \
            --input repo \
            --output repo-yspm/releases/1 \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}" \
            --release 1 \
            --abi yspm-abi-1 \
            --arch x86_64 \
            --yspm /tmp/yspm
          cp repo-yspm/releases/1/index.json repo-index.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${{ github.sha }}" \
            --title "Obsidian Core Linux ${RELEASE_TAG}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "ObsidianCoreLinux-${RELEASE_TAG}.iso" \
            "ObsidianCoreLinux-${RELEASE_TAG}.iso.sha256" \
            repo-index.json \
            qemu-live-uefi.log \
            qemu-live-bios.log \
            qemu-install.log \
            qemu-installed.log \
            --clobber

      - name: Upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find repo-yspm/releases/1/packages -type f -name '*.yspkg' -print0 |
            xargs -0 -r -n 12 gh release upload "${RELEASE_TAG}" --clobber
