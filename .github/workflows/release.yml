name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "${{ inputs.version }}" in
              ''|*[!0-9A-Za-z._-]*) echo "invalid release version" >&2; exit 1 ;;
            esac
            echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            case "$GITHUB_REF_NAME" in
              v*) echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV" ;;
              *) echo "invalid tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
            esac
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio \
            file \
            gzip \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub2-common \
            mtools \
            ovmf \
            qemu-system-x86 \
            xorriso \
            python3

      - name: Build yspm
        env:
          YSPM_OUTPUT: /tmp/yspm
          YSPM_REF: 824b39de2758f5434889b7814888cad2f6a4f16a
        run: sh tools/build-yspm

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          DISTRO_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          DISTRO_VERSION="${DISTRO_VERSION#v}" sudo -E sh build/rootfs.build

      - name: Extract and verify kernel
        run: |
          sudo sh tools/extract-kernel repo/linux_UEFI_standalone.tar /tmp/vmlinuz
          file -b /tmp/vmlinuz | grep -Eqi 'Linux kernel'

      - name: Build live ISO
        run: |
          sudo sh tools/build-iso \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "${{ github.workspace }}/ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso"

      - name: Verify ISO and initramfs
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso"
          test -s "$ISO"

          rm -rf iso-root
          mkdir -p iso-root
          xorriso -osirrox on -indev "$ISO" -extract /boot iso-root/boot

          test -s iso-root/boot/vmlinuz
          test -s iso-root/boot/initramfs.img
          test -s iso-root/boot/grub/grub.cfg

          file -b iso-root/boot/vmlinuz | grep -Eqi 'Linux kernel'
          gzip -t iso-root/boot/initramfs.img
          gzip -dc iso-root/boot/initramfs.img | cpio -t > initramfs.list 2>/dev/null

          grep -Eq '(^|/)init$' initramfs.list
          grep -Eq '(^|/)bin/sh$' initramfs.list
          grep -Eq '(^|/)etc/init$' initramfs.list
          grep -Eq '(^|/)etc/hc-live$' initramfs.list
          grep -Eq '(^|/)usr/sbin/hc-installer$' initramfs.list

          xorriso -indev "$ISO" -report_el_torito plain

      - name: Boot ISO in UEFI QEMU
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso"
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) -print -quit)"
          test -n "$OVMF_CODE"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -cdrom "$ISO" \
            -boot d \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-uefi.log 2>&1
          rc=$?
          set -e

          cat qemu-uefi.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-uefi.log
          grep -q 'Obsidian Core Linux installer' qemu-uefi.log
          grep -q 'starting installer on /dev/ttyS0' qemu-uefi.log

      - name: Boot ISO in BIOS QEMU
        run: |
          set -eu
          ISO="ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cdrom "$ISO" \
            -boot d \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-bios.log 2>&1
          rc=$?
          set -e

          cat qemu-bios.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-bios.log
          grep -q 'Obsidian Core Linux installer' qemu-bios.log

      - name: Generate checksums
        run: |
          sha256sum \
            "ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso" > SHA256SUMS

      - name: Build native package repository
        run: |
          rm -rf repo-yspm
          python3 tools/migrate-legacy-repo.py \
            --input repo \
            --output repo-yspm/releases/1 \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}" \
            --release 1 \
            --abi yspm-abi-1 \
            --arch x86_64 \
            --yspm /tmp/yspm
          cp repo-yspm/releases/1/index.json repo-index.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --target "${{ github.sha }}" \
            --title "Obsidian Core Linux ${{ env.RELEASE_TAG }}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ env.RELEASE_TAG }}" \
            "ObsidianCoreLinux-${{ env.RELEASE_TAG }}.iso" \
            SHA256SUMS \
            repo-index.json \
            --clobber

      - name: Upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find repo-yspm/releases/1/packages -type f -name '*.yspkg' -print0 |
            xargs -0 -r -n 12 gh release upload "${{ env.RELEASE_TAG }}" --clobber
