          cat release-qemu.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' release-qemu.log
          grep -q 'Obsidian Core Linux installer' release-qemu.log

          sha256sum "$ISO" > "$ISO.sha256"

