          OVMF_CODE="$(find /usr/share -type f ( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' ) | head -n 1)"
          test -n "$OVMF_CODE"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64             -machine q35             -m 1024             -smp 2             -cpu max             -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE"             -cdrom "$ISO"             -boot d             -no-reboot             -display none             -serial stdio             > release-qemu.log 2>&1
          rc=$?
