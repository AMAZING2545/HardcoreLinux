name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dosfstools \
            e2fsprogs \
            grub-efi-amd64-bin \
            grub2-common \
            xorriso \
            cpio \
            gzip \
            util-linux \
            python3

      - name: Build yspm
        run: |
          YSPM_OUTPUT=/tmp/yspm \
          YSPM_REF=824b39de2758f5434889b7814888cad2f6a4f16a \
          sh tools/build-yspm

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/Yassine-Jemi01/HardcoreLinux/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          DISTRO_VERSION: ${{ github.ref_name }}
        run: |
          DISTRO_VERSION="${DISTRO_VERSION#v}" sudo -E sh build/rootfs.build

      - name: Extract kernel
        run: |
          ARCHIVE=repo/linux_UEFI_standalone.tar
          test -f "$ARCHIVE"
          sudo sh tools/extract-kernel "$ARCHIVE" /tmp/vmlinuz

      - name: Build bootable image
        run: |
          sudo sh tools/build-image \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "$PWD/HardcoreLinux-$GITHUB_REF_NAME.img" \
            2G

      - name: Build live ISO
        run: |
          sudo sh tools/build-iso \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "$PWD/HardcoreLinux-$GITHUB_REF_NAME.iso"

      - name: Build native package repository
        run: |
          rm -rf repo-yspm
          python3 tools/migrate-legacy-repo.py \
            --input repo \
            --output repo-yspm/releases/1 \
            --base-url "https://github.com/Yassine-Jemi01/HardcoreLinux/releases/download/$GITHUB_REF_NAME" \
            --release 1 \
            --abi yspm-abi-1 \
            --arch x86_64 \
            --yspm /tmp/yspm

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Hardcore Linux $GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload image and repository index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp repo-yspm/releases/1/index.json repo-index.json
          gh release upload "$GITHUB_REF_NAME" \
            "HardcoreLinux-$GITHUB_REF_NAME.img" \
            "HardcoreLinux-$GITHUB_REF_NAME.iso" \
            repo-index.json \
            --clobber

      - name: Upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find repo-yspm/releases/1/packages -type f -name '*.yspkg' -print0 |
            xargs -0 -r -n 12 gh release upload "$GITHUB_REF_NAME" --clobber

      - name: Generate release checksums
        run: |
          sha256sum \
            "HardcoreLinux-$GITHUB_REF_NAME.img" \
            "HardcoreLinux-$GITHUB_REF_NAME.iso" \
            repo-index.json > SHA256SUMS

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
