name: Bootable ISO

on:
  push:
    branches:
      - main
      - distro-foundation
      - iso-working
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ISO and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            grub-efi-amd64-bin \
            grub2-common \
            grub-pc-bin \
            mtools \
            ovmf \
            qemu-system-x86 \
            xorriso

      - name: Build yspm
        env:
          YSPM_OUTPUT: /tmp/yspm
          YSPM_REF: 824b39de2758f5434889b7814888cad2f6a4f16a
        run: |
          sh tools/build-yspm

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/Yassine-Jemi01/ObsidianCoreLinux/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          DISTRO_VERSION: ci-${{ github.run_number }}
        run: |
          sudo -E sh build/rootfs.build

      - name: Extract kernel
        run: |
          sudo sh tools/extract-kernel repo/linux_UEFI_standalone.tar /tmp/vmlinuz

      - name: Build live ISO
        run: |
          sudo sh tools/build-iso \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "${{ github.workspace }}/ObsidianCoreLinux-${{ github.sha }}.iso"

      - name: Verify ISO structure
        run: |
          test -s "ObsidianCoreLinux-${{ github.sha }}.iso"
          xorriso -indev "ObsidianCoreLinux-${{ github.sha }}.iso" -find /boot -type f -print

      - name: Boot ISO in QEMU
        run: |
          set +e
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n 1)"
          test -n "$OVMF_CODE" || {
            echo "OVMF firmware not found"
            exit 1
          }

          timeout 25s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -bios "$OVMF_CODE" \
            -cdrom "ObsidianCoreLinux-${{ github.sha }}.iso" \
            -boot d \
            -display none \
            -serial stdio \
            > qemu.log 2>&1
          RC=$?
          set -e

          cat qemu.log

          if [ "$RC" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $RC"
            exit 1
          fi

          grep -q "Obsidian Core Linux installer" qemu.log || {
            echo "Live installer did not appear on the serial console"
            exit 1
          }

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-iso-${{ github.sha }}
          path: ObsidianCoreLinux-${{ github.sha }}.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload QEMU boot log
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-qemu-log-${{ github.sha }}
          path: qemu.log
          if-no-files-found: error
          retention-days: 14
