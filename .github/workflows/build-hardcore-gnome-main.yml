name: Build Hardcore Linux GNOME ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout HardcoreLinux
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso erofs-utils rsync qemu-system-x86

      - name: Download Chimera GNOME live ISO
        run: |
          curl -fL --retry 3             https://repo.chimera-linux.org/live/latest/chimera-linux-x86_64-LIVE-20251220-gnome.iso             -o /tmp/chimera-gnome.iso

      - name: Extract Chimera live filesystem
        run: |
          set -eux
          rm -rf iso-tree work
          mkdir -p iso-tree work/source-rootfs work/rootfs
          xorriso -osirrox on -indev /tmp/chimera-gnome.iso -extract / iso-tree
          test -f iso-tree/live/filesystem.erofs
          sudo mount -o loop,ro iso-tree/live/filesystem.erofs work/source-rootfs
          sudo rsync -aHAX --numeric-ids work/source-rootfs/ work/rootfs/
          sudo umount work/source-rootfs
          sudo chown -R "$(id -u):$(id -g)" work/rootfs

      - name: Build yspm
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Compile yspm
        run: |
          set -eux
          rm -rf /tmp/yspm
          git clone --depth 1 https://github.com/Yassine-Jemi01/yspm.git /tmp/yspm
          cd /tmp/yspm
          git checkout --detach 6a7535f6a6206b375eb0e1f6ba7cabc649f69e99
          CGO_ENABLED=0 GOTOOLCHAIN=local go build             -trimpath -buildvcs=false -ldflags='-s -w'             -o /tmp/yspm-bin ./cmd/yspm
          chmod 0755 /tmp/yspm-bin

      - name: Apply Hardcore branding and yspm
        run: |
          set -eux
          ROOT=work/rootfs

          sudo install -D -m 0755 /tmp/yspm-bin "$ROOT/usr/bin/yspm"
          sudo install -D -m 0755 tools/init "$ROOT/usr/local/sbin/hardcore-init"
          sudo install -D -m 0755 tools/initctl "$ROOT/usr/local/sbin/hardcore-initctl"

          sudo tee "$ROOT/etc/hardcore-release" >/dev/null <<'EOF'
          NAME="HardCore Linux"
          VERSION="1.0.0-GNOME"
          EDITION="ObsidianCore"
          BASE="Chimera Linux musl userland"
          PACKAGE_MANAGER="yspm"
          EOF

          sudo mkdir -p "$ROOT/usr/share/applications"
          sudo tee "$ROOT/usr/share/applications/yspm.desktop" >/dev/null <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=yspm
          Comment=HardCore Linux package manager
          Exec=gnome-console -- yspm
          Terminal=false
          Categories=System;
          EOF

          if [ -f "$ROOT/etc/os-release" ]; then
            sudo sed -i               -e 's/^NAME=.*/NAME="HardCore Linux"/'               -e 's/^PRETTY_NAME=.*/PRETTY_NAME="HardCore Linux GNOME"/'               -e 's/^ID=.*/ID=hardcore/'               -e 's/^VERSION=.*/VERSION="1.0.0-GNOME"/'               "$ROOT/etc/os-release" || true
          fi

      - name: Validate GNOME and yspm
        run: |
          set -eux
          test -x work/rootfs/usr/bin/gnome-shell
          test -x work/rootfs/usr/bin/yspm
          test -x work/rootfs/usr/local/sbin/hardcore-init

      - name: Repack EROFS
        run: |
          set -eux
          mv iso-tree/live/filesystem.erofs iso-tree/live/filesystem.erofs.orig
          sudo mkfs.erofs -b 4096 -z lzma -E ztailpacking             iso-tree/live/filesystem.erofs work/rootfs
          test -s iso-tree/live/filesystem.erofs
          rm -f iso-tree/live/filesystem.erofs.orig
          sudo rm -rf work/rootfs work/source-rootfs

      - name: Rebuild bootable ISO
        run: |
          set -eux
          xorriso             -indev /tmp/chimera-gnome.iso             -outdev "$PWD/HardcoreLinux-ObsidianCore-GNOME.iso"             -boot_image any replay             -map "$PWD/iso-tree" /             -volid HARDCORE_LINUX             -commit             -end
          test -s HardcoreLinux-ObsidianCore-GNOME.iso

      - name: Validate ISO
        run: |
          set -eux
          xorriso -indev HardcoreLinux-ObsidianCore-GNOME.iso -report_el_torito plain
          xorriso -indev HardcoreLinux-ObsidianCore-GNOME.iso -find /live -name 'filesystem.erofs' -print
          test $(stat -c %s HardcoreLinux-ObsidianCore-GNOME.iso) -gt 1000000000

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreLinux-ObsidianCore-GNOME
          path: HardcoreLinux-ObsidianCore-GNOME.iso
          if-no-files-found: error
          retention-days: 7
