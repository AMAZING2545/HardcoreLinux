name: Build Hardcore Linux GNOME ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout HardcoreLinux
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools qemu-system-x86

      - name: Download Chimera GNOME live ISO
        run: |
          curl -fL --retry 3             https://repo.chimera-linux.org/live/latest/chimera-linux-x86_64-LIVE-20251220-gnome.iso             -o /tmp/chimera-gnome.iso

      - name: Extract ISO and root filesystem
        run: |
          set -eux
          rm -rf work iso-tree
          mkdir -p work iso-tree
          xorriso -osirrox on -indev /tmp/chimera-gnome.iso -extract / iso-tree
          SQFS="$(find iso-tree -type f -name '*.squashfs' | head -n 1)"
          test -n "$SQFS"
          echo "SQFS=$SQFS" >> "$GITHUB_ENV"
          unsquashfs -d work/rootfs "$SQFS"

      - name: Build yspm
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Compile yspm
        run: |
          set -eux
          rm -rf /tmp/yspm
          git clone --depth 1 https://github.com/Yassine-Jemi01/yspm.git /tmp/yspm
          cd /tmp/yspm
          git checkout --detach 6a7535f6a6206b375eb0e1f6ba7cabc649f69e99
          CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -buildvcs=false -ldflags='-s -w' -o /tmp/yspm-bin ./cmd/yspm
          chmod 0755 /tmp/yspm-bin

      - name: Apply Hardcore branding and yspm
        run: |
          set -eux
          ROOT=work/rootfs
          install -D -m 0755 /tmp/yspm-bin "$ROOT/usr/bin/yspm"
          install -D -m 0755 tools/init "$ROOT/usr/local/sbin/hardcore-init"
          install -D -m 0755 tools/initctl "$ROOT/usr/local/sbin/hardcore-initctl"

          cat > "$ROOT/etc/hardcore-release" <<'EOF'
          NAME="HardCore Linux"
          VERSION="1.0.0-GNOME"
          EDITION="ObsidianCore"
          BASE="Chimera Linux musl userland"
          PACKAGE_MANAGER="yspm"
          EOF

          if [ -f "$ROOT/etc/os-release" ]; then
            sed -i               -e 's/^NAME=.*/NAME="HardCore Linux"/'               -e 's/^PRETTY_NAME=.*/PRETTY_NAME="HardCore Linux GNOME"/'               -e 's/^ID=.*/ID=hardcore/'               -e 's/^VERSION=.*/VERSION="1.0.0-GNOME"/'               -e 's#^HOME_URL=.*#HOME_URL="https://github.com/Yassine-Jemi01/HardcoreLinux"#'               "$ROOT/etc/os-release" || true
          fi

          mkdir -p "$ROOT/usr/share/applications"
          cat > "$ROOT/usr/share/applications/yspm.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=yspm
          Comment=HardCore Linux package manager
          Exec=gnome-terminal -- yspm
          Terminal=false
          Categories=System;
          EOF

      - name: Repack GNOME filesystem
        run: |
          set -eux
          mv "$SQFS" "$SQFS.orig"
          mksquashfs work/rootfs "$SQFS" -comp zstd -noappend -processors "$(nproc)"
          rm -rf work/rootfs "$SQFS.orig"

      - name: Rebuild bootable ISO
        run: |
          set -eux
          rm -f HardcoreLinux-ObsidianCore-GNOME.iso
          xorriso             -indev /tmp/chimera-gnome.iso             -outdev "$PWD/HardcoreLinux-ObsidianCore-GNOME.iso"             -boot_image any replay             -map "$PWD/iso-tree" /             -commit             -end
          test -s HardcoreLinux-ObsidianCore-GNOME.iso
          xorriso -indev HardcoreLinux-ObsidianCore-GNOME.iso -report_el_torito plain

      - name: Validate payload
        run: |
          set -eux
          unsquashfs -ll "$SQFS" | grep -E '/usr/bin/gnome-shell$|/usr/bin/yspm$|/usr/local/sbin/hardcore-init$'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreLinux-ObsidianCore-GNOME
          path: HardcoreLinux-ObsidianCore-GNOME.iso
          if-no-files-found: error
          retention-days: 7
