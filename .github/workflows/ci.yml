          ISO="ObsidianCoreLinux-${{ github.sha }}.iso"

          set +e
          timeout --kill-after=5s 30s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cdrom "$ISO" \
            -boot d \
            -no-reboot \
            -display none \
            -serial stdio \
            > qemu-bios.log 2>&1
          rc=$?
          set -e

          cat qemu-bios.log
          test "$rc" -eq 124
          grep -q 'Obsidian Core Linux init' qemu-bios.log
          grep -q 'Obsidian Core Linux installer' qemu-bios.log

      - name: Upload verified ISO
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-iso-${{ github.sha }}
          path: |
            ObsidianCoreLinux-${{ github.sha }}.iso
            ObsidianCoreLinux-${{ github.sha }}.iso.sha256
          if-no-files-found: error
