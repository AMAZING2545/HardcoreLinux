            > qemu.log 2>&1
          RC=$?
          set -e

          cat qemu.log

          test "$RC" -eq 124 || {
            echo "QEMU exited unexpectedly with status $RC"
            exit 1
          }

          grep -q "Obsidian Core Linux installer" qemu.log || {
            echo "Live installer did not appear on the serial console"
            exit 1
          }

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-iso-${{ github.sha }}
          path: |
            ObsidianCoreLinux-${{ github.sha }}.iso
            ObsidianCoreLinux-${{ github.sha }}.iso.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-qemu-log-${{ github.sha }}
          path: qemu.log
          if-no-files-found: error
          retention-days: 90
 initramfs.list

          xorriso -indev "$ISO" -report_el_torito plain
          sha256sum "$ISO" | tee "$ISO.sha256"

      - name: Boot ISO in QEMU
        run: |
          set -u
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n 1)"
