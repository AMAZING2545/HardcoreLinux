name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          set -eu
          for file in \
            tools/hc-installer \
            tools/hc-setup-desktop \
            tools/hc-release-checksums \
            tools/bench-system \
            tools/build-yspm \
            tools/extract-kernel \
            tools/build-image \
            tools/run-qemu \
            tools/run-iso \
            tools/hc-doctor \
            tools/hc-recovery \
            tools/obsidian-first-login \
            tools/migrate-independent.sh \
            tools/build-native-meson \
            tools/build-native-configure \
            tools/build-iso \
            build/rootfs.build \
            build/rootfs_build/init \
            build/rootfs_build/initctl \
            build/rootfs_build/scripts/00000-eth0-dhcp; do
              sh -n "$file"
          done

      - name: Shellcheck errors
        run: |
          shellcheck -S error \
            tools/hc-installer \
            tools/hc-setup-desktop \
            tools/hc-release-checksums \
            tools/bench-system \
            tools/build-yspm \
            tools/extract-kernel \
            tools/build-image \
            tools/run-qemu \
            tools/run-iso \
            tools/hc-doctor \
            tools/hc-recovery \
            tools/obsidian-first-login \
            tools/migrate-independent.sh \
            tools/build-native-meson \
            tools/build-native-configure \
            tools/build-iso \
            build/rootfs.build \
            build/rootfs_build/init \
            build/rootfs_build/initctl \
            build/rootfs_build/scripts/00000-eth0-dhcp

      - name: Python syntax
        run: python3 -m py_compile tools/migrate-legacy-repo.py

  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ISO and VM tooling
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dpkg::Lock::Timeout=120 \
            install -y --no-install-recommends \
            cpio \
            gzip \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub2-common \
            mtools \
            ovmf \
            qemu-system-x86 \
            xorriso

      - name: Build yspm
        env:
          YSPM_OUTPUT: /tmp/yspm
          YSPM_REF: 824b39de2758f5434889b7814888cad2f6a4f16a
        run: sh tools/build-yspm

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/${{ github.repository }}/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          DISTRO_VERSION: ci-${{ github.run_number }}
        run: sudo -E sh build/rootfs.build

      - name: Extract kernel
        run: sudo sh tools/extract-kernel repo/linux_UEFI_standalone.tar /tmp/vmlinuz

      - name: Build live ISO
        run: |
          sudo sh tools/build-iso \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "${{ github.workspace }}/HardcoreLinux-ObsidianCore.iso"

      - name: Verify ISO contents
        run: |
          ISO="HardcoreLinux-ObsidianCore.iso"
          test -s "$ISO"

          rm -rf iso-root
          mkdir -p iso-root
          xorriso -osirrox on -indev "$ISO" -extract /boot iso-root/boot
          test -s iso-root/boot/vmlinuz
          test -s iso-root/boot/initramfs.img
          test -s iso-root/boot/grub/grub.cfg

          rm -rf initramfs-root
          mkdir -p initramfs-root
          gzip -dc iso-root/boot/initramfs.img | (cd initramfs-root && cpio -idm --quiet)
          test -f initramfs-root/etc/hc-live
          test -x initramfs-root/usr/sbin/hc-installer

          xorriso -indev "$ISO" -report_el_torito plain
          sha256sum "$ISO" | tee "$ISO.sha256"

      - name: Boot ISO in QEMU
        run: |
          set +e
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n 1)"
          test -n "$OVMF_CODE" || {
            echo "OVMF firmware not found"
            exit 1
          }

          timeout --kill-after=5s 35s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -bios "$OVMF_CODE" \
            -cdrom "HardcoreLinux-ObsidianCore.iso" \
            -boot d \
            -no-reboot \
            -no-shutdown \
            -display none \
            -serial stdio \
            > qemu.log 2>&1
          RC=$?
          set -e

          cat qemu.log

          test "$RC" -eq 124 || {
            echo "QEMU did not remain running after boot; exit status: $RC"
            exit 1
          }

          grep -q "Obsidian Core Linux installer" qemu.log || {
            echo "Live installer did not appear on the serial console"
            exit 1
          }

      - name: Upload ready ISO
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreLinux-Obsidian-ISO
          path: |
            HardcoreLinux-ObsidianCore.iso
            HardcoreLinux-ObsidianCore.iso.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload QEMU boot log
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreLinux-Obsidian-QEMU-log
          path: qemu.log
          if-no-files-found: error
          retention-days: 14
