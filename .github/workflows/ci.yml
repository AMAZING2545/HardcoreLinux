name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          set -eu
          for file in \
            tools/hc-installer \
            tools/hc-setup-desktop \
            tools/hc-release-checksums \
            tools/bench-system \
            tools/build-yspm \
            tools/extract-kernel \
            tools/build-image \
            tools/run-qemu \
            tools/run-iso \
            tools/hc-doctor \
            tools/hc-recovery \
            tools/obsidian-first-login \
            tools/migrate-independent.sh \
            tools/build-native-meson \
            tools/build-native-configure \
            build/rootfs.build \
            build/rootfs_build/init \
            build/rootfs_build/initctl \
            build/rootfs_build/scripts/00000-eth0-dhcp \
            build/rootfs_build/services/iwd \
            build/rootfs_build/services/dbus \
            build/rootfs_build/services/elogind \
            build/rootfs_build/services/NetworkManager \
            build/rootfs_build/services/polkit \
            build/rootfs_build/services/bluetooth \
            build/rootfs_build/services/upower \
            build/rootfs_build/services/power-profiles-daemon \
            build/rootfs_build/services/fwupd \
            build/rootfs_build/services/udev \
            build/rootfs_build/services/chronyd \
            build/rootfs_build/services/nftables \
            build/rootfs_build/services/iwd \
            build/rootfs_build/services/dbus \
            build/rootfs_build/services/elogind \
            build/rootfs_build/services/NetworkManager \
            build/rootfs_build/services/polkit \
            build/rootfs_build/services/bluetooth \
            build/rootfs_build/services/upower \
            build/rootfs_build/services/power-profiles-daemon \
            build/rootfs_build/services/fwupd \
            build/rootfs_build/services/udev \
            build/rootfs_build/services/chronyd \
            build/rootfs_build/services/nftables \
            build.native/yspm.build \
            build.native/labwc.build \
            build.native/ly.build \
            build.native/iwd.build \
            build.native/pipewire.build \
            build.native/wireplumber.build \
            build.native/waybar.build \
            build.native/wofi.build \
            build.native/ell.build; do
              sh -n "$file"
          done

      - name: Shellcheck errors
        run: |
          shellcheck -S error \
            tools/hc-installer \
            tools/hc-setup-desktop \
            tools/hc-release-checksums \
            tools/bench-system \
            tools/build-yspm \
            tools/extract-kernel \
            tools/build-image \
            tools/run-qemu \
            tools/run-iso \
            tools/hc-doctor \
            tools/hc-recovery \
            tools/obsidian-first-login \
            tools/migrate-independent.sh \
            tools/build-native-meson \
            tools/build-native-configure \
            build/rootfs.build \
            build/rootfs_build/init \
            build/rootfs_build/initctl \
            build/rootfs_build/scripts/00000-eth0-dhcp

      - name: Python syntax
        run: python3 -m py_compile tools/migrate-legacy-repo.py


  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install ISO and VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub2-common \
            mtools \
            ovmf \
            qemu-system-x86 \
            xorriso

      - name: Build yspm
        env:
          YSPM_OUTPUT: /tmp/yspm
          YSPM_REF: 824b39de2758f5434889b7814888cad2f6a4f16a
        run: sh tools/build-yspm

      - name: Build root filesystem
        env:
          YSPM_BIN: /tmp/yspm
          YSPM_REPOSITORY_URL: https://github.com/Yassine-Jemi01/ObsidianCoreLinux/releases/latest/download/repo-index.json
          YSPM_ARCHIVE_DIR: ${{ github.workspace }}/repo
          ROOTFS: /tmp/rootfs
          OUTPUT: /tmp/rootfs.tar
          DISTRO_VERSION: ci-${{ github.run_number }}
        run: sudo -E sh build/rootfs.build

      - name: Extract kernel
        run: sudo sh tools/extract-kernel repo/linux_UEFI_standalone.tar /tmp/vmlinuz

      - name: Build live ISO
        run: |
          sudo sh tools/build-iso \
            /tmp/rootfs.tar \
            /tmp/vmlinuz \
            "${{ github.workspace }}/ObsidianCoreLinux-${{ github.sha }}.iso"

      - name: Verify ISO structure
        run: |
          ISO="ObsidianCoreLinux-${{ github.sha }}.iso"
          test -s "$ISO"

          BOOT_FILES="$(xorriso -indev "$ISO" -find /boot -type f)"
          printf '%s\\n' "$BOOT_FILES"

          printf '%s\\n' "$BOOT_FILES" | grep -qx '/boot/vmlinuz'
          printf '%s\\n' "$BOOT_FILES" | grep -qx '/boot/initramfs.img'

      - name: Boot ISO in QEMU
        run: |
          set +e
          OVMF_CODE="$(find /usr/share -type f \( -name 'OVMF_CODE_4M.fd' -o -name 'OVMF_CODE.fd' \) | head -n 1)"
          test -n "$OVMF_CODE" || {
            echo "OVMF firmware not found"
            exit 1
          }

          timeout 25s qemu-system-x86_64 \
            -machine q35 \
            -m 1024 \
            -smp 2 \
            -cpu max \
            -bios "$OVMF_CODE" \
            -cdrom "ObsidianCoreLinux-${{ github.sha }}.iso" \
            -boot d \
            -display none \
            -serial stdio \
            > qemu.log 2>&1
          RC=$?
          set -e

          cat qemu.log

          if [ "$RC" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $RC"
            exit 1
          fi

          grep -q "Obsidian Core Linux installer" qemu.log || {
            echo "Live installer did not appear on the serial console"
            exit 1
          }

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-iso-${{ github.sha }}
          path: ObsidianCoreLinux-${{ github.sha }}.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-core-linux-qemu-log-${{ github.sha }}
          path: qemu.log
          if-no-files-found: error
          retention-days: 14

